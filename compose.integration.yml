services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: integration-only
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: sqlclient_integration
    ports:
      - "127.0.0.1::3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: integration-only
      POSTGRES_DB: sqlclient_integration
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "postgres",
          "-d",
          "sqlclient_integration",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
